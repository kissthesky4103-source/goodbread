index<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>굿빵 자체 빵지순례 지도</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* 웹화면 전체에 지도가 꽉 차게 지정합니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 말풍선(팝업) 내부 스타일 정의 */
        .bakery-popup {
            padding: 5px;
            min-width: 220px;
            line-height: 1.6;
        }
        .bakery-name {
            font-size: 16px;
            font-weight: bold;
            color: #8B4513; /* 따뜻한 빵집 느낌의 브라운 색상 */
            border-bottom: 2px solid #D2B48C;
            padding-bottom: 5px;
            margin-bottom: 8px;
        }
        .bakery-info {
            font-size: 12px;
            color: #333;
        }
        .info-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 65px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. 전라북도 지역이 크게 보이도록 초기 중심 좌표와 확대 레벨(9) 설정
        var map = L.map('map').setView([35.8242, 127.1480], 12);

        // 2. OpenStreetMap 무료 타일 레이어 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. 굿빵 DB 분석 데이터 배열 (위도/경도가 유효한 입점 업체 26곳 전체 연동)
        var bakeries = [
          { "name": "잇츠브레드", "qual": "제과제빵 명인, 전북명인", "prod": "크림치즈, 쏘세지빵, 마늘빵, 부추빵, 케이크", "hours": "09:00 ~ 21:00", "lat": 35.8732, "lng": 127.0665 },
          { "name": "정철브레드", "qual": "제과제빵 명인, 전북명인", "prod": "단호박카스테라, 고구마빵, 우리밀 쿠키", "hours": "08:00 ~ 21:00", "lat": 35.8368, "lng": 127.1309 },
          { "name": "이중현제빵소", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "전주식 호두과자, 무화과깜빠뉴, 쌀바밤빵", "hours": "08:00 ~ 20:00", "lat": 35.8102, "lng": 127.1018 },
          { "name": "허니비 베이커리(본점)", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "생크림케이크, 블루베리 크룽지, 슈크림빵", "hours": "07:00 ~ 22:30", "lat": 35.8310, "lng": 127.1642 },
          { "name": "허니비 베이커리(에코점)", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "생크림케이크, 블루베리 크룽지, 슈크림빵", "hours": "07:00 ~ 22:30", "lat": 35.8713, "lng": 127.13435 },
          { "name": "군산 영국빵집", "qual": "제과제빵 명인, 전북명인", "prod": "찰보리만주, 야채빵", "hours": "08:00 ~ 21:00", "lat": 35.9755, "lng": 126.7155 },
          { "name": "전주 모짜르트 제과점", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "단호박빵, 프리첼", "hours": "07:30 ~ 22:00", "lat": 35.8045, "lng": 127.1090 },
          { "name": "김정선 베이커리", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "단호박빵, 프리첼", "hours": "07:30 ~ 22:00", "lat": 35.7200, "lng": 127.0000 },
          { "name": "베이커 리", "qual": "제과제빵명장, 제과제빵 명인, 전북명인", "prod": "단팥빵, 야채빵", "hours": "09:00 ~ 22:00", "lat": 35.9668, "lng": 126.6925 },
          { "name": "이상호 베이커리", "qual": "제과제빵 명인, 전북명인", "prod": "야채빵, 꽈배기", "hours": "08:30 ~ 22:00", "lat": 35.8540, "lng": 127.1700 },
          { "name": "천사의양식", "qual": "제과제빵 명인, 전북명인", "prod": "생크림케이크", "hours": "07:00 ~ 22:30", "lat": 35.8550, "lng": 127.1600 },
          { "name": "궁의전병", "qual": "제과제빵 명인, 전북명인", "prod": "수제 전병 종류", "hours": "08:00 ~ 21:00", "lat": 35.8450, "lng": 127.1400 },
          { "name": "전주 담", "qual": "제과제빵 명인, 전북명인, 제과기능장", "prod": "전주빵 (모악산빵, 부채빵, 태극선빵, 복숭아빵)", "hours": "08:00 ~ 21:00", "lat": 35.8337, "lng": 127.0742 },
          { "name": "전주 명진당", "qual": "제과제빵 명인, 전남명인, 유럽월드마스터 명장", "prod": "전주 복숭아빵(특허), 딸기 듬뿍 케이크, 현미쌀 소금빵", "hours": "08:00 ~ 22:00", "lat": 35.788993, "lng": 127.135099 },
          { "name": "황남택 과자점", "qual": "대한민국 쌀빵명인, 제과기능장", "prod": "쌀식빵, 팡콩파이, 갈릭 난, 통통밤빵, 생크림 케이크", "hours": "08:00 ~ 21:30", "lat": 35.8105, "lng": 127.1400 },
          { "name": "네잎클로버 베이커리 카페", "qual": "대한민국 제과기능장, 전북특별자치도 명장", "prod": "쌀소금빵, 에그 타르트, 쿠키 종류", "hours": "10:00 ~ 22:00", "lat": 35.8095, "lng": 127.1085 },
          { "name": "김진곤 제빵소", "qual": "대한민국 제과기능장, 전북특별자치도 명장", "prod": "소금빵, 단팥빵, 추자빵, 씨앗과자", "hours": "08:00 ~ 21:00", "lat": 35.8380, "lng": 127.0612 },
          { "name": "원백당 베이커리", "qual": "아시아 베이커리명인", "prod": "쌀쉬폰, 단팥빵, 무화과 캄파뉴", "hours": "08:30 ~ 22:00", "lat": 35.8347, "lng": 127.0994 },
          { "name": "홍윤베이커리", "qual": "명인, 제과기능장, 군산시 명장", "prod": "현미카스테라, 현미식빵", "hours": "09:00 ~ 22:00", "lat": 35.9671, "lng": 126.7144 },
          { "name": "바게뜨 베이커리", "qual": "명인, 제과기능장, 군산시 명장", "prod": "진지드세요, 찰보리식빵, 쌍둥이 단팥빵", "hours": "08:00 ~ 22:00", "lat": 35.9680, "lng": 126.7410 },
          { "name": "영탁 제빵소", "qual": "제과기능장, 제과제빵 명인", "prod": "바질베이글, 까망 크런치, 쌀빵", "hours": "08:00 ~ 21:00", "lat": 35.8092, "lng": 127.1246 },
          { "name": "느림보베이커리", "qual": "제과기능장", "prod": "딸기 케이크, 치아바타", "hours": "08:00 ~ 20:00", "lat": 35.9637, "lng": 126.7161 },
          { "name": "티파니 베이커리 카페", "qual": "제과기능장", "prod": "딸기시루, 망고케이크", "hours": "10:00 ~ 21:00", "lat": 35.8231, "lng": 127.1376 },
          { "name": "맘스브레드", "qual": "제과기능장", "prod": "오징어먹물빵", "hours": "08:30 ~ 21:30", "lat": 35.8086, "lng": 127.1035 },
          { "name": "풍성제과", "qual": "제과기능장, 제31회 특별 신지식인", "prod": "옥수수식빵, 마늘스틱, 찹쌀도너츠", "hours": "08:00 ~ 22:00", "lat": 35.9435, "lng": 126.9542 },
          { "name": "밀의온도", "qual": "제과기능장", "prod": "크로아상, 홍국식빵, 마늘바게뜨", "hours": "09:30 ~ 21:00", "lat": 35.7732, "lng": 127.2070 }
        ];

        // 4. 반복문을 돌며 각각의 위치에 마커를 찍고 맞춤형 말풍선을 바인딩합니다
        for (var i = 0; i < bakeries.length; i++) {
            var b = bakeries[i];
            
            // 말풍선 내부에 들어갈 HTML 구조 설계
            var popupContent = 
                '<div class="bakery-popup">' +
                    '<div class="bakery-name">' + b.name + '</div>' +
                    '<div class="bakery-info">' +
                        '<div><span class="info-label">자격구분:</span>' + b.qual + '</div>' +
                        '<div><span class="info-label">대표상품:</span>' + b.prod + '</div>' +
                        '<div><span class="info-label">영업시간:</span>' + b.hours + '</div>' +
                    '</div>' +
                '</div>';
            
            // 마커 생성 및 지도 추가
            L.marker([b.lat, b.lng])
                .addTo(map)
                .bindPopup(popupContent);
        }
    </script>
</body>
</html>
