<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>굿빵 GoodBread v3 - 예약 MVP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  body { background: #E8E0D8; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
  :root { --brown: #7B4E2A; --caramel: #B8844A; --cream: #F7F5F2; --beige: #F3E9DC; --text: #333333; --muted: #9A8070; --accent: #E67E22; }

  .phone { width: 390px; background: #F7F5F2; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.3); min-height: 844px; position: relative; display: flex; flex-direction: column; }
  .phone-notch { height: 44px; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink:0; }
  .phone-notch span { color: white; font-size: 12px; font-weight: 600; }

  .screen { display: none; flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 80px; flex-direction: column; }
  .screen.active { display: flex; }
  .screen::-webkit-scrollbar { display: none; }

  .header { background: white; padding: 14px 16px 12px; border-bottom: 1px solid #F0E8DE; position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: 700; color: var(--brown); }
  .logo span { color: var(--caramel); }
  .location { font-size: 12px; color: var(--muted); }
  .search-bar { display: flex; align-items: center; background: #F7F5F2; border-radius: 10px; padding: 9px 12px; gap: 8px; }
  .search-bar input { border: none; background: none; font-size: 14px; color: var(--text); outline: none; flex: 1; }
  .search-bar input::placeholder { color: #B0A090; }

  .filter-row { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: white; border-bottom: 1px solid #F0E8DE; flex-shrink:0; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #E0D5C8; font-size: 12px; font-weight: 500; color: var(--muted); background: white; cursor: pointer; white-space: nowrap; }
  .filter-btn.active { background: var(--brown); border-color: var(--brown); color: white; }

  .section { padding: 16px; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .section-title span { font-size: 12px; font-weight: 400; color: var(--caramel); }

  .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge-명인 { background: #FFF3E0; color: #E67E22; }
  .badge-명장 { background: #FCE4EC; color: #C0392B; }
  .badge-기능장 { background: #E8F5E9; color: #27AE60; }

  .bakery-card { background: white; border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); cursor: pointer; }
  .bakery-thumb { width: 72px; height: 72px; border-radius: 10px; background: linear-gradient(135deg, #F3E9DC, #B8844A); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .bakery-info { flex: 1; min-width: 0; }
  .bakery-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .bakery-addr { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bakery-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .star { color: #F5A623; font-size: 12px; }
  .meta-text { font-size: 11px; color: var(--muted); }
  .pickup-tag { background: #E8F4F0; color: #1D9E75; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 500; }

  /* 상세 페이지 */
  .detail-page { display: none; position: absolute; top: 44px; left: 0; right: 0; bottom: 0; background: #F7F5F2; overflow-y: auto; z-index: 30; }
  .detail-page.open { display: block; }
  .detail-page::-webkit-scrollbar { display: none; }
  .detail-hero { width: 100%; height: 220px; background: linear-gradient(135deg, #C8A06A, #7B4E2A); display: flex; align-items: center; justify-content: center; font-size: 80px; position: relative; }
  .back-btn { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .heart-btn { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .detail-body { padding: 16px 16px 120px; }
  .detail-name { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .detail-addr { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .detail-desc { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 16px; padding: 14px; background: white; border-radius: 12px; }
  
  /* MVP: 대표 상품 섹션 */
  .product-section { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .product-card { display: flex; gap: 12px; align-items: center; }
  .product-img { width: 80px; height: 80px; background: var(--beige); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .product-info { flex: 1; }
  .product-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .product-price { font-size: 15px; font-weight: 600; color: var(--accent); }
  
  /* MVP: 하단 고정 예약 버튼 */
  .detail-footer { position: fixed; bottom: 0; width: 390px; background: white; padding: 16px 20px 34px; border-top: 1px solid #F0E8DE; z-index: 40; }
  .reserve-submit-btn { width: 100%; background: var(--brown); color: white; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(123,78,42,0.2); }
  
  /* MVP: 예약 팝업 (모달) */
  .modal-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal-content { width: 100%; background: white; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 700; }
  .close-modal { font-size: 24px; cursor: pointer; color: var(--muted); }
  
  .reserve-summary { background: var(--beige); padding: 14px; border-radius: 12px; margin-bottom: 20px; }
  .reserve-summary div { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .reserve-summary strong { font-size: 15px; color: var(--brown); }
  
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .form-input { width: 100%; padding: 12px; border: 1.5px solid #E0D5C8; border-radius: 10px; font-size: 14px; outline: none; }
  .form-input:focus { border-color: var(--brown); }

  /* 지도 */
  .map-container { flex: 1; position: relative; background: #E8E0D5; display: flex; flex-direction: column; min-height: 600px; }
  .map-bg { flex: 1; background: linear-gradient(160deg, #DDD5C8 0%, #C8BFB0 100%); position: relative; overflow: hidden; }
  .map-list { background: white; border-radius: 20px 20px 0 0; padding: 12px 16px; max-height: 200px; overflow-y: auto; flex-shrink: 0; }
  
  /* 예약 탭 */
  .tab-header { background: white; padding: 16px; border-bottom: 1px solid #F0E8DE; position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
  .tab-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .tab-sub { font-size: 12px; color: var(--muted); }
  .reserve-card { background: white; border-radius: 14px; margin: 12px 16px 0; padding: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  .reserve-card-top { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
  .reserve-emoji { width: 50px; height: 50px; background: var(--beige); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .reserve-info { flex: 1; }
  .reserve-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .reserve-item-text { font-size: 12px; color: var(--muted); }
  .reserve-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .status-wait { background: #FFF3E0; color: #E67E22; }
  .status-ready { background: #E8F5E9; color: #27AE60; }
  .status-done { background: #F5F5F5; color: #999; }
  .reserve-time { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }

  /* 하단 네비 */
  .bottom-nav { position: sticky; bottom: 0; background: white; border-top: 1px solid #F0E8DE; display: flex; padding: 8px 0 20px; z-index: 20; flex-shrink: 0; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .nav-icon { font-size: 22px; }
  .nav-label { font-size: 10px; color: var(--muted); }
  .nav-item.active .nav-label { color: var(--brown); font-weight: 600; }

  @media (max-width: 430px) {
    body { padding: 0; }
    .phone { border-radius: 0; width: 100%; min-height: 100vh; }
    .detail-footer { width: 100%; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-notch"><span>9:41</span><span>🔋</span></div>

  <!-- 홈 -->
  <div class="screen active" id="screen-홈">
    <div class="header">
      <div class="header-top">
        <div class="logo">굿<span>빵</span> GoodBread</div>
        <div class="location">📍 전주시 덕진구</div>
      </div>
      <div class="search-bar">
        <span style="color:#B0A090;font-size:14px">🔍</span>
        <input type="text" placeholder="빵집, 빵 이름 검색" id="searchInput" oninput="renderBakeries()">
      </div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('전체',this)">전체</button>
      <button class="filter-btn" onclick="setFilter('전주시',this)">전주시</button>
      <button class="filter-btn" onclick="setFilter('군산시',this)">군산시</button>
      <button class="filter-btn" onclick="setFilter('김제시',this)">김제시</button>
      <button class="filter-btn" onclick="setFilter('익산시',this)">익산시</button>
    </div>
    <div class="section">
      <div class="section-title">추천 장인 빵집</div>
      <div id="bakeryList"></div>
    </div>
  </div>

  <!-- 지도 -->
  <div class="screen" id="screen-지도">
    <div class="header"><div class="logo">내 주변 굿빵</div></div>
    <div class="map-container">
      <div class="map-bg" style="display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px;">지도 데이터 로딩 중...</div>
      <div class="map-list" id="mapList"></div>
    </div>
  </div>

  <!-- 예약 -->
  <div class="screen" id="screen-예약">
    <div class="tab-header">
      <div class="tab-title">나의 예약 현황</div>
      <div class="tab-sub">신청하신 예약 내역을 확인하세요</div>
    </div>
    <div id="reserveContent">
      <!-- 예약 목록이 여기에 렌더링됨 -->
    </div>
  </div>

  <!-- 찜 -->
  <div class="screen" id="screen-찜">
    <div class="tab-header">
      <div class="tab-title">찜한 빵집</div>
      <div class="tab-sub" id="likeCount">0곳을 찜했습니다</div>
    </div>
    <div id="likeContent"></div>
  </div>

  <!-- 마이 -->
  <div class="screen" id="screen-마이">
    <div class="my-header">
      <div class="my-avatar">👤</div>
      <div class="my-name">굿빵 회원</div>
      <div class="my-email">goodbread@example.com</div>
    </div>
    <div style="height:16px;"></div>
    <div class="section">
        <div class="section-title">내 활동</div>
        <div style="display:flex; gap:10px;">
            <div style="flex:1; background:white; padding:16px; border-radius:12px; text-align:center;">
                <div style="font-size:20px; font-weight:700; color:var(--brown);" id="visitCount">0</div>
                <div style="font-size:11px; color:var(--muted);">방문 기록</div>
            </div>
            <div style="flex:1; background:white; padding:16px; border-radius:12px; text-align:center;">
                <div style="font-size:20px; font-weight:700; color:var(--brown);" id="likeNum">0</div>
                <div style="font-size:11px; color:var(--muted);">찜한 빵집</div>
            </div>
        </div>
    </div>
  </div>

  <!-- 상세 페이지 -->
  <div class="detail-page" id="detailPage">
    <div class="detail-hero">
      <button class="back-btn" onclick="closeDetail()">←</button>
      <button class="heart-btn" id="heartBtn" onclick="toggleHeart()">🤍</button>
      <span id="detailEmoji" style="font-size:80px">🍞</span>
    </div>
    <div class="detail-body">
      <div id="detailBadges" style="margin-bottom:10px;"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-addr" id="detailAddr"></div>
      
      <!-- MVP: 대표 상품 정보 -->
      <div class="section-title" style="font-size:14px;margin-bottom:10px;">대표 상품 예약</div>
      <div class="product-section">
          <div class="product-card">
              <div class="product-img" id="detailProductEmoji">🎂</div>
              <div class="product-info">
                  <div class="product-name" id="detailProductName">시그니처 케이크</div>
                  <div class="product-price" id="detailProductPrice">₩25,000</div>
              </div>
          </div>
      </div>

      <div class="detail-desc" id="detailDesc"></div>
      <div class="section-title" style="font-size:14px;margin-bottom:10px;">운영 정보</div>
      <div id="detailInfo" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;"></div>
    </div>
    
    <!-- MVP: 예약 버튼 -->
    <div class="detail-footer">
        <button class="reserve-submit-btn" onclick="openReserveModal()">예약하기</button>
    </div>
  </div>

  <!-- MVP: 예약 모달 -->
  <div class="modal-overlay" id="reserveModal">
      <div class="modal-content">
          <div class="modal-header">
              <div class="modal-title">예약 신청</div>
              <div class="close-modal" onclick="closeReserveModal()">×</div>
          </div>
          <div class="reserve-summary">
              <div>베이커리: <strong id="modalBakeryName">-</strong></div>
              <div>상품명: <strong id="modalProductName">-</strong></div>
          </div>
          <div class="form-group">
              <label class="form-label">픽업 날짜</label>
              <input type="date" class="form-input" id="reserveDate">
          </div>
          <div class="form-group">
              <label class="form-label">픽업 시간</label>
              <input type="time" class="form-input" id="reserveTime">
          </div>
          <div class="form-group">
              <label class="form-label">수량</label>
              <input type="number" class="form-input" id="reserveCount" value="1" min="1">
          </div>
          <button class="reserve-submit-btn" style="margin-top:10px;" onclick="submitReservation()">예약 신청하기</button>
      </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="showTab('홈')"><div class="nav-icon">🏠</div><div class="nav-label">홈</div></div>
    <div class="nav-item" onclick="showTab('지도')"><div class="nav-icon">🗺️</div><div class="nav-label">지도</div></div>
    <div class="nav-item" onclick="showTab('예약')"><div class="nav-icon">📋</div><div class="nav-label">예약</div></div>
    <div class="nav-item" onclick="showTab('찜')"><div class="nav-icon">🤍</div><div class="nav-label">찜</div></div>
    <div class="nav-item" onclick="showTab('마이')"><div class="nav-icon">👤</div><div class="nav-label">마이</div></div>
  </div>
</div>

<script>
const BAKERIES = [
  { id:'B001', name:'잇츠브레드', district:'전주시', address:'전주시 기린대로 693', badge:'명인', rating:4.8, distance:'320m', description:'39년 경력 전북 제과제빵 명인이 운영. 유산균을 직접 배양해 반죽에 넣는 건강한 빵집.', emoji:'🥐', product:'소금앙버터', price:4500, productEmoji:'🥯' },
  { id:'B002', name:'정철브레드', district:'전주시', address:'전주시 덕진구 거북바우3길 5', badge:'명인', rating:4.7, distance:'480m', description:'40년 경력 명인의 설탕·밀가루 제로 다이어트빵 전문점.', emoji:'🌿', product:'단호박카스테라', price:6500, productEmoji:'🍞' },
  { id:'B003', name:'이중현제빵소', district:'전주시', address:'전주시 완산구 우전로 180', badge:'명인/기능장', rating:4.9, distance:'750m', description:'40년 명인·기능장이 만드는 빵집. 전주식 호두과자는 전국 택배 폭주 중.', emoji:'🍪', product:'전주식 호두과자 세트', price:15000, productEmoji:'📦' },
  { id:'B004', name:'허니비 베이커리', district:'전주시', address:'전주시 덕진구 정언신로 94', badge:'명인/기능장', rating:4.7, distance:'1.1km', description:'41년 경력 명인·기능장. 전주에서 생크림 케이크 가장 맛있는 곳.', emoji:'🍰', product:'딸기 생크림 케이크', price:32000, productEmoji:'🎂' },
  { id:'B025', name:'맘스브레드', district:'전주시', address:'전주시 완산구 호암로 81', badge:'기능장', rating:4.9, distance:'2.0km', description:'전주 3대 빵집 출연. 소금빵 10개 구매시 32% 할인.', emoji:'🎬', product:'소금빵 10개 세트', price:18000, productEmoji:'🥐' },
];

let activeFilter = '전체';
let likedItems = new Set();
let reservations = [
    { bakeryName: '맘스브레드', productName: '소금빵 10개 세트', date: '2024-06-12', time: '14:30', count: 1, status: '준비중' }
];
let currentBakery = null;

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBakeries();
}

function renderBakeries() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = BAKERIES.filter(b => {
    const mf = activeFilter === '전체' || b.district === activeFilter;
    const ms = !query || b.name.toLowerCase().includes(query);
    return mf && ms;
  });
  const list = document.getElementById('bakeryList');
  list.innerHTML = filtered.map(b => `
    <div class="bakery-card" onclick="openDetail('${b.id}')">
      <div class="bakery-thumb">${b.emoji}</div>
      <div class="bakery-info">
        <div style="display:flex;gap:5px;margin-bottom:4px;">
          <span class="badge badge-${b.badge.split('/')[0]}" style="font-size:10px;">${b.badge}</span>
        </div>
        <div class="bakery-name">${b.name}</div>
        <div class="bakery-addr">📍 ${b.address}</div>
        <div class="bakery-meta">
          <span class="star">★</span><span class="meta-text">${b.rating} · ${b.distance}</span>
        </div>
      </div>
    </div>`).join('');
}

function showTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (tab === '예약') renderReservations();
  if (tab === '찜') renderLikes();
}

function openDetail(id) {
  const b = BAKERIES.find(x => x.id === id);
  currentBakery = b;
  document.getElementById('detailEmoji').textContent = b.emoji;
  document.getElementById('detailName').textContent = b.name;
  document.getElementById('detailAddr').textContent = '📍 ' + b.address;
  document.getElementById('detailDesc').textContent = b.description;
  document.getElementById('detailProductName').textContent = b.product;
  document.getElementById('detailProductPrice').textContent = '₩' + b.price.toLocaleString();
  document.getElementById('detailProductEmoji').textContent = b.productEmoji;
  
  document.getElementById('detailBadges').innerHTML = `<span class="badge badge-${b.badge.split('/')[0]}">${b.badge}</span>`;
  document.getElementById('detailInfo').innerHTML = `
    <div style="background:white; padding:10px; border-radius:10px;"><div style="font-size:11px; color:var(--muted);">평점</div><div style="font-size:13px; font-weight:600;">★ ${b.rating}</div></div>
    <div style="background:white; padding:10px; border-radius:10px;"><div style="font-size:11px; color:var(--muted);">거리</div><div style="font-size:13px; font-weight:600;">${b.distance}</div></div>
  `;
  
  document.getElementById('heartBtn').textContent = likedItems.has(id) ? '❤️' : '🤍';
  document.getElementById('detailPage').classList.add('open');
  document.getElementById('visitCount').textContent = parseInt(document.getElementById('visitCount').textContent) + 1;
}

function closeDetail() {
  document.getElementById('detailPage').classList.remove('open');
}

function toggleHeart() {
  if (!currentBakery) return;
  if (likedItems.has(currentBakery.id)) likedItems.delete(currentBakery.id);
  else likedItems.add(currentBakery.id);
  document.getElementById('heartBtn').textContent = likedItems.has(currentBakery.id) ? '❤️' : '🤍';
  document.getElementById('likeNum').textContent = likedItems.size;
}

// MVP: 예약 모달 제어
function openReserveModal() {
    if (!currentBakery) return;
    document.getElementById('modalBakeryName').textContent = currentBakery.name;
    document.getElementById('modalProductName').textContent = currentBakery.product;
    
    // 기본 날짜를 내일로 설정
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('reserveDate').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('reserveTime').value = "14:00";
    
    document.getElementById('reserveModal').classList.add('open');
}

function closeReserveModal() {
    document.getElementById('reserveModal').classList.remove('open');
}

function submitReservation() {
    const date = document.getElementById('reserveDate').value;
    const time = document.getElementById('reserveTime').value;
    const count = document.getElementById('reserveCount').value;
    
    if (!date || !time || !count) {
        alert('모든 정보를 입력해주세요.');
        return;
    }
    
    const newReserve = {
        bakeryName: currentBakery.name,
        productName: currentBakery.product,
        date: date,
        time: time,
        count: count,
        status: '준비중'
    };
    
    // 1. 데이터 저장 (Local State)
    reservations.unshift(newReserve);
    
    // 2. 관리자 테스트용 콘솔 출력 (요구사항 5번)
    console.log("--- 신규 예약 발생 (관리자 확인용) ---");
    console.log("베이커리명:", newReserve.bakeryName);
    console.log("상품명:", newReserve.productName);
    console.log("날짜:", newReserve.date);
    console.log("시간:", newReserve.time);
    console.log("수량:", newReserve.count);
    console.log("-----------------------------------");
    
    // 3. 완료 메시지 출력 (요구사항 4번)
    alert("예약 신청이 완료되었습니다.\n베이커리 확인 후 연락드립니다.");
    
    // 4. 모달 닫기 및 초기화
    closeReserveModal();
    closeDetail();
    showTab('예약');
}

function renderReservations() {
    const content = document.getElementById('reserveContent');
    if (reservations.length === 0) {
        content.innerHTML = '<div style="padding:60px; text-align:center; color:var(--muted);">예약 내역이 없습니다.</div>';
        return;
    }
    
    content.innerHTML = reservations.map(r => `
        <div class="reserve-card">
            <div class="reserve-card-top">
                <div class="reserve-emoji">🥐</div>
                <div class="reserve-info">
                    <div class="reserve-name">${r.bakeryName}</div>
                    <div class="reserve-item-text">${r.productName} × ${r.count}개</div>
                </div>
                <span class="reserve-status ${r.status === '준비중' ? 'status-wait' : 'status-done'}">${r.status}</span>
            </div>
            <div class="reserve-time">
                <span>🕐 ${r.date} ${r.time} 픽업 예정</span>
            </div>
        </div>
    `).join('');
}

function renderLikes() {
    const content = document.getElementById('likeContent');
    const likedList = BAKERIES.filter(b => likedItems.has(b.id));
    document.getElementById('likeCount').textContent = likedList.length + '곳을 찜했습니다';
    
    if (likedList.length === 0) {
        content.innerHTML = '<div style="padding:60px; text-align:center; color:var(--muted);">찜한 빵집이 없습니다.</div>';
        return;
    }
    
    content.innerHTML = likedList.map(b => `
        <div class="bakery-card" onclick="openDetail('${b.id}')" style="margin:12px 16px;">
            <div class="bakery-thumb">${b.emoji}</div>
            <div class="bakery-info">
                <div class="bakery-name">${b.name}</div>
                <div class="bakery-addr">📍 ${b.address}</div>
            </div>
        </div>
    `).join('');
}

// 초기 렌더링
renderBakeries();
</script>
</body>
</html>
